name: 每日签到
# 北京时间 8:07 自动签到 (UTC 0:07)
on:
  schedule:
    # 每天北京时间 6:00 执行 (UTC+8 = 前一天 22:00 UTC)
    # 预留 10 小时延迟余量，确保当天签上
    - cron: "37 22 * * *"
  workflow_dispatch:  # 支持手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到
        run: python checkin.py
        env:
          HONGQIYE_USERNAME: ${{ secrets.HONGQIYE_USERNAME }}
          HONGQIYE_PASSWORD: ${{ secrets.HONGQIYE_PASSWORD }}
