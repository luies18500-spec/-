name: 每日签到
# 北京时间 8:07 自动签到 (UTC 0:07)
on:
  schedule:
    # 一天 3 个触发时点，应对延迟（脚本幂等，重复运行无害）
    # UTC 22:37 = 北京 6:37   UTC 4:17 = 北京 12:17   UTC 10:47 = 北京 18:47
    - cron: "37 22 * * *"
    - cron: "17 4 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:  # 支持手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到
        run: python checkin.py
        env:
          HONGQIYE_USERNAME: ${{ secrets.HONGQIYE_USERNAME }}
          HONGQIYE_PASSWORD: ${{ secrets.HONGQIYE_PASSWORD }}
